name: Honeynet CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-terraform:
    name: Terraform Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Install Checkov
        run: pip install checkov

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ./terraform
        continue-on-error: false

      - name: Terraform Init (validate only, no backend)
        run: terraform init -backend=false
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Run tflint
        run: |
          tflint --init
          tflint --recursive
        working-directory: ./terraform

      - name: Run Checkov Security Scan
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --output cli \
            --soft-fail \
            --skip-check CKV_AWS_8
        continue-on-error: false

  lint-ansible:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Run ansible-lint
        run: ansible-lint ansible/playbooks/
        continue-on-error: true

  validate-scripts:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  security-summary:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [lint-terraform, lint-ansible, validate-scripts]
    steps:
      - name: All checks passed
        run: echo "All security and lint checks passed. Safe to review."
